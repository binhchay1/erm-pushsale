; Production supervisor — copy to /etc/supervisor/conf.d/pushsale-worker.conf
; Tách queue theo luồng để chat/webhook/notification không nghẽn chung.

[program:pushsale-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/erm-pushsale/artisan queue:work database --queue=default,reports,exports,translations --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/erm-pushsale/storage/logs/queue-default.log

[program:pushsale-queue-chat]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/erm-pushsale/artisan queue:work database --queue=messages,broadcasts-internal-chat,pancake-chat,broadcasts-pancake-chat --sleep=1 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/erm-pushsale/storage/logs/queue-chat.log

[program:pushsale-queue-notifications]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/erm-pushsale/artisan queue:work database --queue=notifications --sleep=1 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/erm-pushsale/storage/logs/queue-notifications.log

[program:pushsale-reverb]
command=php /var/www/erm-pushsale/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/erm-pushsale/storage/logs/reverb.log
