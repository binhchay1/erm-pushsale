; Production supervisor — copy to /etc/supervisor/conf.d/pushsale-worker.conf
; QUEUE_CONNECTION phải khớp driver ở đây (hiện app dùng database).

[program:pushsale-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/erm-pushsale/artisan queue:work database --queue=default,notifications,translations --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/erm-pushsale/storage/logs/queue.log

[program:pushsale-reverb]
command=php /var/www/erm-pushsale/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/erm-pushsale/storage/logs/reverb.log
